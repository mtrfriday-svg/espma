name: Build M'DEE ESP32-S3 N4R2 OLED6

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.14
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/2.0.14/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Install libraries
        run: |
          arduino-cli lib install 'Adafruit GFX Library@1.11.11'
          arduino-cli lib install 'Adafruit SSD1306@2.5.13'
          arduino-cli lib install 'LinkedList@1.3.3'
          arduino-cli lib install 'ArduinoJson@6.21.5'
          arduino-cli lib install 'Adafruit NeoPixel@1.12.3'
          arduino-cli lib install 'NimBLE-Arduino@1.4.2'
          arduino-cli lib install 'AsyncTCP@1.1.4'
          arduino-cli lib install 'ESP Async WebServer@1.2.4'
          arduino-cli lib install 'ESP32Ping@1.7.0'
          arduino-cli lib install 'MicroNMEA@2.0.6'
          arduino-cli lib install 'EspSoftwareSerial@8.1.0'

      - name: Build N4R2 firmware
        run: |
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=enabled' \
            --libraries libraries \
            --build-property 'compiler.cpp.extra_flags=-DMDEE_S3_SUPER_MINI' \
            --warnings none \
            --output-dir build/mdee \
            esp32_marauder/esp32_marauder.ino

      - name: Rename firmware
        run: cp build/mdee/esp32_marauder.ino.bin build/mdee/mdee_s3_n4r2_oled6.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdee-s3-n4r2-oled6
          path: build/mdee/mdee_s3_n4r2_oled6.bin
